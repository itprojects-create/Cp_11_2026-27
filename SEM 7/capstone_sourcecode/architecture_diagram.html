<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Campus Carbon Intelligence - System Architecture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .title-group h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
    }
    .title-group p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 2px;
    }
    .btn-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #334155;
      color: #f8fafc;
      border-color: #475569;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .main-container {
      flex: 1;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: auto;
    }
    .diagram-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 100%;
      overflow: auto;
    }
    .diagram-card img {
      display: block;
      max-width: 100%;
      height: auto;
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      color: #64748b;
      font-size: 0.85rem;
      border-top: 1px solid #1e293b;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>Smart Campus Sustainability Intelligence Platform</h1>
      <p>End-to-End System Architectural Diagram &amp; Data Pipeline</p>
    </div>
    <div class="btn-group">
      <a class="btn btn-primary" style="background:#f97316;" href="architecture_diagram.drawio" download="architecture_diagram.drawio">
        🎨 Download .drawio (Editable)
      </a>
      <a class="btn btn-primary" href="architecture_diagram.png" download="architecture_diagram.png">
        📥 Download PNG
      </a>
      <a class="btn btn-primary" href="architecture_diagram.svg" download="architecture_diagram.svg">
        📥 Download SVG
      </a>
      <a class="btn btn-secondary" href="https://app.diagrams.net/" target="_blank" rel="noreferrer">
        🔗 Open draw.io Web App
      </a>
      <button class="btn btn-secondary" onclick="window.print()">
        🖨️ Print / PDF
      </button>
    </div>
  </header>

  <main class="main-container">
    <div class="diagram-card">
      <img src="architecture_diagram.svg" alt="System Architectural Diagram" />
    </div>
  </main>

  <footer>
    VESIT Smart Campus Carbon Accounting Platform &bull; ISO 14064 &bull; GHG Protocol Aligned
  </footer>
</body>
</html>
